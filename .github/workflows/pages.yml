# Validates the source branch. GitHub Pages publishing is prepared locally by npm run publish:pages.
# The end-to-end tests (npm run e2e) are not part of this workflow; run them locally.

name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
